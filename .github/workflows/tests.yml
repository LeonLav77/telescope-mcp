name: tests

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  sqlite:
    name: PHP ${{ matrix.php }} · Laravel ${{ matrix.laravel }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
        laravel: ['12', '13']
        include:
          - laravel: '12'
            testbench: '^10.8'
          - laravel: '13'
            testbench: '^11.0'
        exclude:
          # Laravel 13 needs PHP 8.3.
          - php: '8.2'
            laravel: '13'

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite
          coverage: none

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install dependencies
        run: |
          composer require "illuminate/support:^${{ matrix.laravel }}.0" "orchestra/testbench:${{ matrix.testbench }}" --dev --no-interaction --no-update
          composer update --prefer-dist --no-interaction --no-progress

      - name: Run tests
        run: vendor/bin/pest

  databases:
    name: ${{ matrix.db }} · PHP 8.4 · Laravel 13
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - db: mysql
            port: 3307
          - db: pgsql
            port: 5433

    # Ports and credentials match tests/TestCase.php.
    services:
      mysql:
        image: ${{ matrix.db == 'mysql' && 'mysql:8.0' || '' }}
        env:
          MYSQL_ROOT_PASSWORD: secret
          MYSQL_DATABASE: tmcp
        ports: ['3307:3306']
        options: --health-cmd="mysqladmin ping -psecret" --health-interval=5s --health-timeout=5s --health-retries=20
      postgres:
        image: ${{ matrix.db == 'pgsql' && 'postgres:16-alpine' || '' }}
        env:
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: tmcp
        ports: ['5433:5432']
        options: --health-cmd=pg_isready --health-interval=5s --health-timeout=5s --health-retries=20

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql, pdo_pgsql
          coverage: none

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Run tests
        run: vendor/bin/pest
        env:
          TEST_DB: ${{ matrix.db }}
          TEST_DB_PORT: ${{ matrix.port }}
